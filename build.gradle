plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

extensions {
    loom {
        minecraftVersion = '1.21.4'
        mappings = '1.21.4+build.1'
        run {
            version = 'client'
            propertyMap {
                property 'fabric-api.global_datagen' = 'false'
            }
        }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.4'
    mappings 'net.fabricmc:yarn:1.21.4+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.7'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.99.0+1.21.4'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', loom.minecraftVersion
}

jar {
    from {
        configurations.compileClasspath.get().filter { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}
